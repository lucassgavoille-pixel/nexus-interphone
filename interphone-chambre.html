<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Interphone · Chambre</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030d06;
    --surface: #08150d;
    --border: #0f3020;
    --accent: #00ff88;
    --accent2: #ffcc00;
    --blue: #00aaff;
    --red: #ff2244;
    --orange: #ff6b00;
    --text: #b0e8c0;
    --muted: #2a6040;
    --glow: 0 0 20px rgba(0,255,136,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(0,255,136,0.012) 50px, rgba(0,255,136,0.012) 51px),
      repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(0,255,136,0.012) 50px, rgba(0,255,136,0.012) 51px);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 100;
  }

  .container {
    width: 100%;
    max-width: 700px;
    padding: 20px 16px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 2px solid var(--accent);
  }

  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 4px;
    text-shadow: var(--glow);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .live-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--bg);
    background: var(--red);
    padding: 3px 8px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .live-badge.visible { opacity: 1; animation: pulse-badge 1.5s infinite; }
  @keyframes pulse-badge { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .conn-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s;
  }
  .dot.online { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse-d 2s infinite; }
  .dot.ringing { background: var(--orange); box-shadow: 0 0 12px var(--orange); animation: pulse-d 0.4s infinite; }
  @keyframes pulse-d { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ID Panel */
  .id-panel {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .id-col {}

  .id-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .id-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 3px;
    text-shadow: var(--glow);
    word-break: break-all;
  }

  .id-input-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .id-input-wrap input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 9px 12px;
    letter-spacing: 2px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .id-input-wrap input:focus { border-color: var(--accent); }
  .id-input-wrap input::placeholder { color: var(--muted); font-size: 10px; }

  .btn-link {
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 9px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    width: 100%;
  }
  .btn-link:hover { background: #33ffaa; }
  .btn-link:active { transform: scale(0.98); }

  /* Vidéo principale */
  .video-monitor {
    width: 100%;
    position: relative;
    background: #000;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .video-monitor::before {
    content: '';
    display: block;
    padding-top: 56.25%; /* 16:9 */
  }

  .video-monitor video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .monitor-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .corner { position: absolute; width: 28px; height: 28px; }
  .corner-tl { top: 10px; left: 10px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner-tr { top: 10px; right: 10px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .corner-bl { bottom: 10px; left: 10px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner-br { bottom: 10px; right: 10px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

  .monitor-label {
    position: absolute;
    top: 14px; left: 50%; transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: rgba(0,255,136,0.5);
    letter-spacing: 4px;
  }

  .monitor-time {
    position: absolute;
    bottom: 14px; right: 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: rgba(0,255,136,0.6);
    letter-spacing: 1px;
  }

  /* Waiting screen */
  .waiting-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--surface);
  }

  .waiting-icon {
    font-size: 48px;
    opacity: 0.2;
  }

  .waiting-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 3px;
    text-align: center;
  }

  /* Incoming ring overlay */
  .ring-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,107,0,0.12);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    animation: ring-flash 0.5s infinite alternate;
    z-index: 10;
  }
  .ring-overlay.active { display: flex; }

  @keyframes ring-flash {
    from { background: rgba(255,107,0,0.08); }
    to { background: rgba(255,107,0,0.25); }
  }

  .ring-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    color: var(--orange);
    letter-spacing: 4px;
    text-shadow: 0 0 20px var(--orange);
    animation: ring-flash 0.5s infinite alternate;
  }

  .ring-subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: rgba(255,107,0,0.7);
    letter-spacing: 2px;
  }

  /* Actions */
  .actions {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .action-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 1.5px;
    padding: 16px 8px;
    cursor: pointer;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .action-btn:active { transform: scale(0.96); }

  .action-btn.answer {
    border-color: var(--accent);
    color: var(--accent);
  }
  .action-btn.answer:active { background: rgba(0,255,136,0.1); }

  .action-btn.unlock {
    border-color: var(--accent2);
    color: var(--accent2);
    grid-column: 1 / -1;
    flex-direction: row;
    padding: 20px;
    font-size: 16px;
    letter-spacing: 4px;
    font-weight: 700;
    justify-content: center;
  }
  .action-btn.unlock:active { background: rgba(255,204,0,0.1); }

  .action-btn.hangup {
    border-color: var(--red);
    color: var(--red);
  }
  .action-btn.hangup:active { background: rgba(255,34,68,0.1); }

  .action-btn.mic-btn.muted {
    border-color: var(--red);
    color: var(--red);
    background: rgba(255,34,68,0.05);
  }

  .action-btn svg { flex-shrink: 0; }

  /* Vol / notification */
  .vol-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 16px;
  }

  .vol-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    min-width: 80px;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    background: var(--border);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    background: var(--accent);
    border-radius: 0;
    cursor: pointer;
    box-shadow: 0 0 8px var(--accent);
  }

  /* Log */
  .log-panel {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px;
  }

  .log-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .log-clear {
    font-size: 9px;
    cursor: pointer;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 2px 8px;
    background: none;
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 1px;
  }
  .log-clear:hover { color: var(--accent); border-color: var(--accent); }

  .log-entries {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    line-height: 1.9;
    max-height: 100px;
    overflow-y: auto;
  }

  .entry { display: flex; gap: 10px; }
  .entry .time { color: var(--accent); min-width: 58px; opacity: 0.7; }
  .entry.ok .msg { color: var(--accent); }
  .entry.err .msg { color: var(--red); }
  .entry.warn .msg { color: var(--orange); }
  .entry.info .msg { color: var(--text); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 12px 28px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 500;
    pointer-events: none;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: rgba(0,255,136,0.1); border: 1px solid var(--accent); color: var(--accent); }
  .toast.warning { background: rgba(255,107,0,0.1); border: 1px solid var(--orange); color: var(--orange); }

  /* Audio ring element */
  .audio-ring { position: absolute; opacity: 0; pointer-events: none; }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  @media (max-width: 400px) {
    .id-panel { grid-template-columns: 1fr; }
    .actions { grid-template-columns: 1fr 1fr; }
    .action-btn.unlock { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <span class="logo">⬡ CHAMBRE</span>
    <div class="header-right">
      <div class="live-badge" id="liveBadge">● LIVE</div>
      <div class="conn-indicator">
        <div class="dot" id="mainDot"></div>
        <span id="connLabel" style="font-size:10px;">HORS LIGNE</span>
      </div>
    </div>
  </div>

  <!-- IDs -->
  <div class="id-panel">
    <div class="id-col">
      <div class="id-label">▸ MON ID CHAMBRE</div>
      <div class="id-value" id="myId">----</div>
      <div style="margin-top:6px;">
        <div class="id-label" style="margin-top:6px;">▸ Donner cet ID à la porte</div>
      </div>
    </div>
    <div class="id-col">
      <div class="id-input-wrap">
        <div class="id-label">▸ ID TÉLÉPHONE PORTE</div>
        <input type="text" id="doorId" placeholder="ID DE LA PORTE" maxlength="20">
        <button class="btn-link" onclick="connectToDoor()">CONNECTER</button>
      </div>
    </div>
  </div>

  <!-- Moniteur vidéo -->
  <div class="video-monitor" id="videoMonitor">
    <div class="waiting-screen" id="waitingScreen">
      <div class="waiting-icon">📺</div>
      <div class="waiting-text">EN ATTENTE<br>DU FLUX PORTE</div>
    </div>

    <video id="remoteVideo" autoplay playsinline style="display:none;"></video>

    <div class="monitor-overlay">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="monitor-label">NEXUS · INTERPHONE</div>
      <div class="monitor-time" id="monitorTime">--:--:--</div>
    </div>

    <!-- Overlay sonnette -->
    <div class="ring-overlay" id="ringOverlay">
      <div class="ring-title">🔔 VISITEUR</div>
      <div class="ring-subtitle">QUELQU'UN EST À LA PORTE</div>
    </div>
  </div>

  <!-- Actions principales -->
  <div class="actions">
    <button class="action-btn answer" onclick="answerCall()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
      </svg>
      RÉPONDRE
    </button>

    <button class="action-btn hangup" id="btnHangup" onclick="hangUp()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(135deg)">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
      </svg>
      REFUSER
    </button>

    <button class="action-btn mic-btn" id="btnMic" onclick="toggleMic()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="micIcon">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <span id="micLabel">MICRO</span>
    </button>

    <button class="action-btn unlock" onclick="sendUnlock()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
      </svg>
      DÉVERROUILLER
    </button>
  </div>

  <!-- Volume sonnette -->
  <div class="vol-row">
    <span class="vol-label">▸ VOLUME</span>
    <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(this.value)">
    <span style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);min-width:28px;text-align:right;" id="volDisplay">80%</span>
  </div>

  <!-- Log -->
  <div class="log-panel">
    <div class="log-title">
      <span>▸ JOURNAL SYSTÈME</span>
      <button class="log-clear" onclick="clearLog()">EFFACER</button>
    </div>
    <div class="log-entries" id="logEntries"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- Audio sonnette Web Audio API -->
<script>
// ─── AUDIO ───────────────────────────────
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let ringVolume = 0.8;
let ringInterval = null;

function playRingTone() {
  const notes = [880, 660, 880, 660];
  let t = audioCtx.currentTime;
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0, t + i * 0.15);
    gain.gain.linearRampToValueAtTime(ringVolume * 0.4, t + i * 0.15 + 0.02);
    gain.gain.linearRampToValueAtTime(0, t + i * 0.15 + 0.13);
    osc.start(t + i * 0.15);
    osc.stop(t + i * 0.15 + 0.14);
  });
}

function startRing() {
  if (ringInterval) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  playRingTone();
  ringInterval = setInterval(playRingTone, 1200);
}

function stopRing() {
  if (ringInterval) { clearInterval(ringInterval); ringInterval = null; }
}

function setVolume(v) {
  ringVolume = parseFloat(v);
  document.getElementById('volDisplay').textContent = Math.round(v * 100) + '%';
}

// ─── PEER ────────────────────────────────
let peer, conn, localStream, remoteStream;
let micEnabled = true;

window.onload = () => {
  initPeer();
  startClock();
};

function initPeer() {
  const savedId = localStorage.getItem('nexus_chambre_id');
  peer = savedId ? new Peer(savedId, { host:'0.peerjs.com', port:443, secure:true, path:'/', debug:0 })
                 : new Peer({ host:'0.peerjs.com', port:443, secure:true, path:'/', debug:0 });

  peer.on('open', id => {
    localStorage.setItem('nexus_chambre_id', id);
    document.getElementById('myId').textContent = id.toUpperCase();
    setDot('online');
    setConnLabel('EN LIGNE');
    log('ok', 'ID actif : ' + id);
  });

  peer.on('connection', c => {
    conn = c;
    setupDataConn(conn);
    log('ok', 'Porte connectée');
  });

  peer.on('call', incoming => {
    log('info', 'Flux vidéo entrant...');
    incoming.answer();
    incoming.on('stream', stream => {
      remoteStream = stream;
      showStream(stream);
      log('ok', 'Flux vidéo actif');
    });
  });

  peer.on('error', e => {
    log('err', 'Erreur: ' + e.type);
    setTimeout(initPeer, 5000);
  });

  peer.on('disconnected', () => {
    setDot('');
    setConnLabel('HORS LIGNE');
    peer.reconnect();
  });
}

// ─── CONNEXION ───────────────────────────
function connectToDoor() {
  const did = document.getElementById('doorId').value.trim().toLowerCase();
  if (!did || !peer) return;
  conn = peer.connect(did, { reliable: true });
  setupDataConn(conn);
  log('info', 'Connexion vers porte ' + did + '...');
}

function setupDataConn(c) {
  c.on('open', () => {
    log('ok', 'Canal data porte ouvert');
    setDot('online');
    setConnLabel('PORTE LIÉE');
  });

  c.on('data', data => {
    if (data.type === 'ring') {
      handleRing();
    }
    if (data.type === 'call_request') {
      log('info', 'Demande appel vidéo...');
    }
  });

  c.on('close', () => {
    setDot('');
    setConnLabel('PORTE DÉCONNECTÉE');
    log('err', 'Porte déconnectée');
    stopRing();
    document.getElementById('ringOverlay').classList.remove('active');
  });
}

// ─── RING ────────────────────────────────
let ringTimeout;

function handleRing() {
  log('warn', '🔔 SONNETTE — visiteur à la porte');
  startRing();
  setDot('ringing');

  document.getElementById('ringOverlay').classList.add('active');

  clearTimeout(ringTimeout);
  ringTimeout = setTimeout(() => {
    stopRing();
    document.getElementById('ringOverlay').classList.remove('active');
    setDot('online');
  }, 15000);

  // Vibration
  if (navigator.vibrate) navigator.vibrate([300,100,300,100,300]);

  showToast('🔔 VISITEUR À LA PORTE', 'warning', 6000);
}

// ─── VIDÉO ───────────────────────────────
function showStream(stream) {
  const vid = document.getElementById('remoteVideo');
  vid.srcObject = stream;
  vid.style.display = 'block';
  document.getElementById('waitingScreen').style.display = 'none';
  document.getElementById('liveBadge').classList.add('visible');
}

// ─── ACTIONS ─────────────────────────────
async function answerCall() {
  stopRing();
  document.getElementById('ringOverlay').classList.remove('active');
  setDot('online');

  // Activer micro local
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    log('ok', 'Micro activé');
  } catch(e) {
    log('err', 'Micro refusé');
  }

  log('ok', 'Appel répondu');
  showToast('CONNEXION ÉTABLIE', 'success', 3000);
}

function hangUp() {
  stopRing();
  document.getElementById('ringOverlay').classList.remove('active');
  setDot('online');
  log('info', 'Appel refusé / terminé');
  showToast('APPEL TERMINÉ', 'warning', 2000);
}

function sendUnlock() {
  if (!conn || !conn.open) {
    log('err', 'Non connecté à la porte');
    showToast('PORTE NON CONNECTÉE', 'warning', 3000);
    return;
  }
  conn.send({ type: 'unlock', ts: Date.now() });
  log('ok', 'Signal déverrouillage envoyé');
  showToast('🔓 SIGNAL ENVOYÉ', 'success', 3000);

  // Flash animation
  const btn = document.querySelector('.action-btn.unlock');
  btn.style.background = 'rgba(255,204,0,0.2)';
  setTimeout(() => btn.style.background = '', 500);
}

function toggleMic() {
  micEnabled = !micEnabled;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
  const btn = document.getElementById('btnMic');
  document.getElementById('micLabel').textContent = micEnabled ? 'MICRO' : 'MUET';
  if (micEnabled) btn.classList.remove('muted');
  else btn.classList.add('muted');
}

// ─── CLOCK ───────────────────────────────
function startClock() {
  function tick() {
    const d = new Date();
    const s = d.getHours().toString().padStart(2,'0') + ':' +
              d.getMinutes().toString().padStart(2,'0') + ':' +
              d.getSeconds().toString().padStart(2,'0');
    document.getElementById('monitorTime').textContent = s;
  }
  tick();
  setInterval(tick, 1000);
}

// ─── UI HELPERS ──────────────────────────
function setDot(state) {
  const d = document.getElementById('mainDot');
  d.className = 'dot' + (state ? ' ' + state : '');
}

function setConnLabel(txt) {
  document.getElementById('connLabel').textContent = txt;
}

function log(type, msg) {
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
  const el = document.getElementById('logEntries');
  const e = document.createElement('div');
  e.className = 'entry ' + type;
  e.innerHTML = `<span class="time">${time}</span><span class="msg">${msg}</span>`;
  el.insertBefore(e, el.firstChild);
  if (el.children.length > 12) el.removeChild(el.lastChild);
}

function clearLog() {
  document.getElementById('logEntries').innerHTML = '';
}

let toastTimer;
function showToast(msg, type, dur) {
  clearTimeout(toastTimer);
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  toastTimer = setTimeout(() => t.classList.remove('show'), dur || 3000);
}
</script>
</body>
</html>
