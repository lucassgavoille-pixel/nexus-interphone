<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Interphone · Porte</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0e;
    --surface: #0a1520;
    --border: #1a3a4a;
    --accent: #00d4ff;
    --accent2: #ff6b00;
    --green: #00ff88;
    --red: #ff2244;
    --text: #c8e8f0;
    --muted: #4a7a8a;
    --glow: 0 0 20px rgba(0,212,255,0.3);
    --glow2: 0 0 30px rgba(0,212,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,212,255,0.015) 40px, rgba(0,212,255,0.015) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,212,255,0.015) 40px, rgba(0,212,255,0.015) 41px);
    pointer-events: none;
    z-index: 0;
  }

  /* Scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 100;
  }

  .container {
    width: 100%;
    max-width: 500px;
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 2px solid var(--accent);
    position: relative;
  }

  .header::before {
    content: 'NEXUS DOOR UNIT v2.1';
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    position: absolute;
    top: -18px;
    left: 0;
    letter-spacing: 2px;
  }

  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    box-shadow: none;
    transition: all 0.3s;
  }
  .status-dot.online { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse-dot 2s infinite; }
  .status-dot.calling { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); animation: pulse-dot 0.5s infinite; }

  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ID Panel */
  .id-panel {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    position: relative;
  }

  .id-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .id-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 4px;
    text-shadow: var(--glow);
  }

  .id-input-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    align-items: center;
  }

  .id-input-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 10px 12px;
    letter-spacing: 2px;
    outline: none;
    transition: border-color 0.2s;
  }
  .id-input-row input:focus { border-color: var(--accent); }
  .id-input-row input::placeholder { color: var(--muted); font-size: 11px; letter-spacing: 1px; }

  .btn-connect {
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 10px 18px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-connect:hover { background: #33ddff; }
  .btn-connect:active { transform: scale(0.97); }

  /* Camera */
  .camera-frame {
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .camera-frame video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1); /* mirror */
  }

  .cam-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border: 1px solid rgba(0,212,255,0.15);
  }

  /* Corner brackets */
  .cam-overlay::before, .cam-overlay::after {
    content: '';
    position: absolute;
    width: 24px; height: 24px;
  }
  .cam-overlay::before {
    top: 8px; left: 8px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
  }
  .cam-overlay::after {
    bottom: 8px; right: 8px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
  }

  .cam-label {
    position: absolute;
    top: 12px; right: 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--accent);
    letter-spacing: 2px;
    opacity: 0.7;
  }

  .cam-rec {
    position: absolute;
    bottom: 12px; left: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--red);
    letter-spacing: 1px;
  }
  .cam-rec-dot {
    width: 6px; height: 6px;
    background: var(--red);
    border-radius: 50%;
    animation: pulse-dot 1s infinite;
  }

  .cam-inactive {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--surface);
  }

  .cam-inactive-icon {
    font-size: 40px;
    opacity: 0.3;
  }

  .cam-inactive-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  /* Controls */
  .controls {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* Sonnette — pleine largeur */
  .btn-ring {
    grid-column: 1 / -1;
    background: transparent;
    border: 2px solid var(--accent2);
    color: var(--accent2);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 4px;
    padding: 22px;
    cursor: pointer;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .btn-ring::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent2);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.15s;
    z-index: 0;
  }

  .btn-ring:active::before { transform: scaleX(1); }
  .btn-ring:active { color: var(--bg); }
  .btn-ring span, .btn-ring svg { position: relative; z-index: 1; }

  .btn-ring.ringing {
    animation: ring-pulse 0.4s infinite alternate;
    border-color: var(--accent2);
    background: rgba(255,107,0,0.1);
  }

  @keyframes ring-pulse {
    from { box-shadow: 0 0 10px rgba(255,107,0,0.4); }
    to { box-shadow: 0 0 30px rgba(255,107,0,0.8), 0 0 60px rgba(255,107,0,0.3); }
  }

  .btn-mic, .btn-cam-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 14px;
    cursor: pointer;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
  }

  .btn-mic:hover, .btn-cam-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .btn-mic.active { border-color: var(--green); color: var(--green); background: rgba(0,255,136,0.05); }
  .btn-mic.muted { border-color: var(--red); color: var(--red); background: rgba(255,34,68,0.05); }

  /* Log */
  .log-panel {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px;
  }

  .log-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .log-entries {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.8;
    max-height: 80px;
    overflow-y: auto;
  }

  .log-entries .entry { display: flex; gap: 8px; }
  .log-entries .entry .time { color: var(--accent); min-width: 55px; }
  .log-entries .entry.ok .msg { color: var(--green); }
  .log-entries .entry.err .msg { color: var(--red); }
  .log-entries .entry.info .msg { color: var(--text); }

  /* Status bar */
  .status-bar {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: 2px solid var(--accent);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    flex: 1;
  }

  .status-text.idle { color: var(--muted); }
  .status-text.connected { color: var(--green); }
  .status-text.calling { color: var(--accent2); }
  .status-text.error { color: var(--red); }

  /* Modal unlock signal */
  .unlock-toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,255,136,0.1);
    border: 1px solid var(--green);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 12px 24px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    pointer-events: none;
  }
  .unlock-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  /* Responsive — portrait téléphone */
  @media (max-width: 360px) {
    .id-value { font-size: 18px; }
    .btn-ring { font-size: 15px; padding: 18px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <span class="logo">⬡ PORTE</span>
    <div style="display:flex;gap:12px;align-items:center;">
      <span id="headerStatus" style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;">HORS LIGNE</span>
      <div class="status-dot" id="statusDot"></div>
    </div>
  </div>

  <!-- ID & connexion -->
  <div class="id-panel">
    <div class="id-label">▸ MON ID (à partager)</div>
    <div class="id-value" id="myId">----</div>
    <div class="id-input-row">
      <input type="text" id="targetId" placeholder="ID TABLETTE CHAMBRE" maxlength="20">
      <button class="btn-connect" id="btnConnect" onclick="connectToChambre()">LIER</button>
    </div>
  </div>

  <!-- Caméra locale (preview) -->
  <div class="camera-frame" id="cameraFrame">
    <div class="cam-inactive" id="camInactive">
      <div class="cam-inactive-icon">📷</div>
      <div class="cam-inactive-text">CAMÉRA INACTIVE</div>
    </div>
    <video id="localVideo" autoplay muted playsinline style="display:none;"></video>
    <div class="cam-overlay"></div>
    <span class="cam-label">LOCAL PREVIEW</span>
    <div class="cam-rec" id="camRec" style="display:none;">
      <div class="cam-rec-dot"></div>
      <span>LIVE</span>
    </div>
  </div>

  <!-- Boutons -->
  <div class="controls">
    <button class="btn-ring" id="btnRing" onclick="ringDoorbell()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span>SONNER</span>
    </button>

    <button class="btn-mic active" id="btnMic" onclick="toggleMic()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <span id="micLabel">MICRO</span>
    </button>

    <button class="btn-cam-toggle" id="btnCam" onclick="startCamera()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 7l-7 5 7 5V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <span id="camLabel">ACTIVER CAM</span>
    </button>
  </div>

  <!-- Log -->
  <div class="log-panel">
    <div class="log-title">▸ JOURNAL SYSTÈME</div>
    <div class="log-entries" id="logEntries"></div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-dot" id="statusDot2"></div>
    <span class="status-text idle" id="statusText">En attente de connexion...</span>
  </div>

</div>

<div class="unlock-toast" id="unlockToast">🔓 DÉVERROUILLÉ</div>

<script>
// ─── CONFIG ──────────────────────────────
const PEER_CONFIG = {
  host: '0.peerjs.com',
  port: 443,
  secure: true,
  path: '/',
  debug: 0
};

// ─── STATE ───────────────────────────────
let peer, conn, call;
let localStream = null;
let micEnabled = true;
let camActive = false;

// ─── INIT ────────────────────────────────
window.onload = () => {
  initPeer();
};

function initPeer() {
  const savedId = localStorage.getItem('nexus_door_id');
  peer = savedId ? new Peer(savedId, PEER_CONFIG) : new Peer(PEER_CONFIG);

  peer.on('open', id => {
    localStorage.setItem('nexus_door_id', id);
    document.getElementById('myId').textContent = id.toUpperCase();
    setStatus('connected', 'Prêt · ID actif');
    setDot('online');
    log('ok', 'Peer connecté : ' + id);
  });

  peer.on('connection', c => {
    conn = c;
    setupDataConn(conn);
    log('ok', 'Chambre connectée');
    setStatus('connected', 'Chambre liée');
    setDot('online');
  });

  peer.on('call', incoming => {
    log('info', 'Appel entrant...');
    if (localStream) {
      incoming.answer(localStream);
    } else {
      incoming.answer();
    }
    call = incoming;
  });

  peer.on('error', e => {
    log('err', 'Erreur: ' + e.type);
    setStatus('error', 'Erreur réseau');
    setTimeout(initPeer, 5000);
  });

  peer.on('disconnected', () => {
    setStatus('idle', 'Déconnecté');
    setDot('');
    peer.reconnect();
  });
}

// ─── CONNEXION ───────────────────────────
function connectToChambre() {
  const tid = document.getElementById('targetId').value.trim().toLowerCase();
  if (!tid || !peer) return;

  conn = peer.connect(tid, { reliable: true });
  setupDataConn(conn);
  log('info', 'Connexion vers ' + tid + '...');
  setStatus('calling', 'Connexion en cours...');

  // Lancer l'appel vidéo si caméra disponible
  if (localStream) startCall(tid);
}

function setupDataConn(c) {
  c.on('open', () => {
    log('ok', 'Canal data ouvert');
    setStatus('connected', 'Connecté à la chambre');
    setDot('online');
    document.getElementById('headerStatus').textContent = 'EN LIGNE';
  });

  c.on('data', data => {
    if (data.type === 'unlock') {
      showUnlockToast();
      log('ok', 'DÉVERROUILLAGE reçu');
    }
    if (data.type === 'call_request') {
      startCall(conn.peer);
    }
  });

  c.on('close', () => {
    setStatus('idle', 'Déconnecté');
    setDot('');
    document.getElementById('headerStatus').textContent = 'HORS LIGNE';
    log('err', 'Connexion fermée');
  });
}

// ─── CAMÉRA ──────────────────────────────
async function startCamera() {
  if (camActive) return;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });

    const vid = document.getElementById('localVideo');
    vid.srcObject = localStream;
    vid.style.display = 'block';
    document.getElementById('camInactive').style.display = 'none';
    document.getElementById('camRec').style.display = 'flex';

    camActive = true;
    document.getElementById('camLabel').textContent = 'CAM ON';
    document.getElementById('btnCam').style.borderColor = 'var(--green)';
    document.getElementById('btnCam').style.color = 'var(--green)';

    log('ok', 'Caméra activée');

    // Si déjà connecté, lancer l'appel
    if (conn && conn.open) {
      const tid = conn.peer;
      startCall(tid);
    }
  } catch (e) {
    log('err', 'Caméra refusée: ' + e.message);
    setStatus('error', 'Accès caméra refusé');
  }
}

function startCall(targetId) {
  if (!localStream || !peer) return;
  call = peer.call(targetId, localStream);
  call.on('stream', () => log('ok', 'Flux envoyé'));
  call.on('error', e => log('err', 'Appel erreur: ' + e));
  log('ok', 'Appel vidéo démarré');
}

// ─── MIC ─────────────────────────────────
function toggleMic() {
  if (!localStream) return;
  micEnabled = !micEnabled;
  localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
  const btn = document.getElementById('btnMic');
  const lbl = document.getElementById('micLabel');
  if (micEnabled) {
    btn.className = 'btn-mic active';
    lbl.textContent = 'MICRO';
  } else {
    btn.className = 'btn-mic muted';
    lbl.textContent = 'MUET';
  }
}

// ─── SONNETTE ────────────────────────────
function ringDoorbell() {
  if (!conn || !conn.open) {
    log('err', 'Non connecté à la chambre');
    setStatus('error', 'Chambre non connectée');
    return;
  }

  conn.send({ type: 'ring', ts: Date.now() });

  const btn = document.getElementById('btnRing');
  btn.classList.add('ringing');
  btn.textContent = '🔔 APPEL EN COURS...';
  setTimeout(() => {
    btn.classList.remove('ringing');
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>SONNER</span>`;
  }, 4000);

  log('info', 'Sonnette activée');

  // Lancer appel vidéo si pas encore fait
  if (localStream && conn.peer) startCall(conn.peer);
  else if (conn.peer) conn.send({ type: 'call_request' });
}

// ─── UI HELPERS ──────────────────────────
function setStatus(type, msg) {
  const el = document.getElementById('statusText');
  el.className = 'status-text ' + type;
  el.textContent = msg;
}

function setDot(state) {
  ['statusDot','statusDot2'].forEach(id => {
    const d = document.getElementById(id);
    d.className = 'status-dot' + (state ? ' ' + state : '');
  });
}

function log(type, msg) {
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
  const el = document.getElementById('logEntries');
  const entry = document.createElement('div');
  entry.className = 'entry ' + type;
  entry.innerHTML = `<span class="time">${time}</span><span class="msg">${msg}</span>`;
  el.insertBefore(entry, el.firstChild);
  if (el.children.length > 10) el.removeChild(el.lastChild);
}

function showUnlockToast() {
  const t = document.getElementById('unlockToast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
